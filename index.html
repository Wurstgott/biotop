   <div class="wfirst"><span class="label">Empfohlen für den Anfang · etwa 2 Minuten</span><button class="btn go wide" ${da("dinge")} id="welcomecheck">Mit dem Hebel-Check beginnen</button><span class="muted" style="font-size:14.5px">Zehn kurze Fragen zeigen, wo sich ein Schritt bei dir am meisten lohnt.</span></div>
   <div class="row wmore"><button class="linkbtn" data-inv="1">Abhaken, was schon Alltag ist</button><button class="linkbtn" id="shx">Erst umschauen</button></div>`);
  $("#sh").querySelectorAll("#shx").forEach(b=>b.onclick=closeSheet)}
function fromHash(){const h=location.hash.slice(1);if(["home","log","know","mis","year"].includes(h)){tab=h;return}
  if(h.startsWith("b-")&&B[h.slice(2)]){cur=h.slice(2);if(!S.read[cur])S.read[cur]=now();tab="know";ktab="bites";return}
  if(h.startsWith("m-")&&M[h.slice(2)]){invited=h.slice(2);tab="mis";setTimeout(()=>misSheet(invited),300)}}
/* ---------- Migration auf gv 3 ----------
   Neue Werte, Punkte nach Wirkung und eine längere Kurve oben. Niemand verliert eine erreichte Stufe:
   Die alte Punktzahl wird auf dieselbe Stelle der neuen Kurve abgebildet (gFloor), und gAdd sorgt dafür, dass neues Wachstum sofort sichtbar bleibt. */
function migrate3(){if(S.gv>=3){if(!S.start){S.start=now();save()}return}
  const OLD=[0,1,5,12,22,35,52,75,105,145];
  let st=now();if(S.welcomed>1e12)st=Math.min(st,S.welcomed);S.log.forEach(e=>{if(!e.g)st=Math.min(st,e.ts)});(S.checks||[]).forEach(c=>st=Math.min(st,c.ts));Object.values(S.base||{}).forEach(t=>{if(t>1e12)st=Math.min(st,t)});S.start=st;
  if(S.checks.length&&!(S.mis.hebelcheck&&S.mis.hebelcheck.status==="done"))S.mis.hebelcheck={status:"done",start:S.checks[0].ts,end:S.checks[0].ts,days:{},auto:1};
  const op=e=>e.g?((e.y||0)>=1000?8:6):((e.k||0)>20?3:(e.k||0)>=1?2:1);
  const gOld=Math.max(S.log.reduce((q,e)=>q+op(e),0)+misDone()*4+Object.keys(S.base||{}).length*3,S.gFloor||0);
  let i=0;OLD.forEach((v,k)=>{if(gOld>=v)i=k});
  const tgt=i<OLD.length-1?STAGES[i][0]+(gOld-OLD[i])/(OLD[i+1]-OLD[i])*(STAGES[i+1][0]-STAGES[i][0]):STAGES[i][0]+(gOld-OLD[i]);
  /* korrigierte Richtwerte gelten auch für frühere Einträge aus dem Katalog */
  S.log.forEach(e=>{const a=A[e.act];if(!a||e.act==="custom")return;e.t=a.t;if(e.g){if(a.y!=null)e.y=a.y}else e.k=a.k||0});
  /* gestapelte Änderungen derselben Gruppe: die frühere endet, wenn die spätere beginnt */
  XG.forEach(g=>{const l=S.log.filter(e=>e.g&&g.includes(e.act)).sort((a,b)=>a.ts-b.ts);for(let k=0;k<l.length-1;k++){const nx=l[k+1];if(!l[k].end||l[k].end>nx.ts)l[k].end=Math.max(l[k].ts,nx.ts)}});
  (S.checks||[]).forEach(c=>{if(c.ans){const ts=c.ts;Object.assign(c,calcCheck(c.ans),{ts})}});
  const t=Math.floor(tgt*10)/10;S.gFloor=t;S.gAdd=Math.max(0,Math.round((t-growthRaw())*10)/10);S.gv=3;
  /* die Umstellung selbst bringt keinen Stufen-Moment */
  if(S.stageSeen!=null)S.stageSeen=Math.max(S.stageSeen,stage().i);save()}
migrate3();
/* ---------- Migration auf gv 4 ----------
   Ehrlichere Bilanz: feste Basislinie, Restwerte, Tagesgrenzen, halber Ersatz bei Gebrauchtem, Grenze für eigene Schätzungen, keine überlappenden Zeiträume,
   Schritte ohne Bezug zum eigenen Alltag ohne kg. Die angezeigten kg alter Einträge dürfen sich dadurch ändern, die erreichte Stufe nicht:
   gFloor und gAdd halten das bisherige Wachstum, neues Wachstum bleibt sofort sichtbar. */
function migrate4(){if(S.gv>=4)return;PTS_MODE=3;MEMO={k:""};const g0=growth(),st0=stage().i;PTS_MODE=4;MEMO={k:""};
  S.log.forEach(e=>{if(e.act==="custom"){if(e.g){if((e.y||0)>KMAX_Y)e.y=KMAX_Y;if(e.y>0)e.est=1}else{if((e.k||0)>KMAX_S)e.k=KMAX_S;if(e.k>0)e.est=1}return}
    const a=A[e.act];if(!a)return;e.t=a.t;if(e.g){if(a.y!=null)e.y=a.y}else e.k=a.k||0});
  /* Zeiträume derselben Änderung und ihrer Gegenstücke: Ein späterer beginnt frühestens, wo ein früherer endet */
  const bl=S.log.filter(e=>e.g&&e.act!=="custom").sort((a,b)=>a.ts-b.ts);
  bl.forEach((e,i)=>{const rv=rivals(e.act);bl.slice(0,i).forEach(x=>{if(x.act!==e.act&&!rv.includes(x.act))return;
    if(!x.end){x.end=Math.max(x.ts,e.ts);return}if(x.end>e.ts){e.ts=x.end;if(e.end&&e.end<e.ts)e.end=e.ts}})});
  save();
  /* Schritte, die laut Check nicht zum eigenen Alltag passen (kein Auto, kein Flug, keine Fernreise), zählen ohne kg */
  const c0=checksA()[0];S.log.forEach(e=>{if(e.act==="custom"||e.nf)return;const w=nfWhy(e.act);if(!w||(!e.g&&!["auto","flug"].includes(w)))return;if(e.g&&c0&&!newSince(e,c0.ts)&&w!=="fern")return;e.nf=w;if(e.g)e.y=0});
  /* Ein Begriff, eine Zahl: Die Quelle „Ernährung“ heißt jetzt „Essen“ und zählt wie der Bereich auch die Lebensmittelreste mit */
  (S.checks||[]).forEach(c=>{if(c.top)c.top=c.top.map(t=>t[0]==="Ernährung"?["Essen",c.area&&c.area.essen!=null?c.area.essen:t[1],t[2]]:t).sort((x,y)=>y[1]-x[1])});
  save();
  const raw=growthRaw();S.gFloor=Math.max(S.gFloor||0,Math.floor(g0*10)/10);S.gAdd=Math.max(S.gAdd||0,Math.round((g0-raw)*10)/10);
  if(S.stageSeen!=null)S.stageSeen=Math.max(S.stageSeen,st0,stage().i);S.gv=4;PTS_MODE=5;MEMO={k:""};save()}
migrate4();
/* ---------- Migration auf gv 5 ----------
   Teil F: eigene Schätzungen mit Quelle und gemeinsamen Grenzen, Rahmen der Quellen wächst mit der Zeit, große Käufe pro Jahr begrenzt,
   Profil aus dem Check (vegetarisch, Ökostrom, Heizung), Wachstumspunkte nach gezählten kg, Wechsel ohne neuen Baum.
   Die angezeigten kg alter Einträge dürfen sich ändern, die erreichte Stufe nicht: gFloor und gAdd halten das bisherige Wachstum.
   Bestehende Bäume bleiben alle stehen, Ketten gelten nur für neue Einträge. */
function migrate5(){if(S.gv>=5)return;PTS_MODE=4;MEMO={k:""};const g0=growth(),st0=stage().i;PTS_MODE=5;
  S.log.forEach(e=>{if(e.act==="custom"){if(e.src==null)e.src=defSrc(e.a);if(e.g&&(e.y||0)>KMAX_Y)e.y=KMAX_Y;return}
    /* Profil nachtragen, so wie es zum Zeitpunkt des Eintrags galt */
    if(e.nf||e.pf!=null||!A[e.act])return;const p=profileOf(e.act,e.ts);if(!p)return;if(p.nf&&!e.g)e.nf=p.nf;else if(p.pf<1){e.pf=p.pf;e.pw=p.pw}});
  save();MEMO={k:""};const raw=growthRaw();S.gFloor=Math.max(S.gFloor||0,Math.floor(g0*10)/10);S.gAdd=Math.max(S.gAdd||0,Math.round((g0-raw)*10)/10);
  if(S.stageSeen!=null)S.stageSeen=Math.max(S.stageSeen,st0,stage().i);S.gv=5;save()}
migrate5();
if(S.stageSeen==null){S.stageSeen=stage().i;save()}
if(location.hash)fromHash();
render();setTimeout(welcome,700);if(IOS)armHaptics();
function checkUpdate(){if(!/github\.io$/.test(location.hostname))return;fetch(location.pathname,{cache:"reload"}).then(r=>r.text()).then(t=>{const m=t.match(/const BUILD="([^"]+)"/);if(!m||m[1]===BUILD)return;let dn=null;try{dn=sessionStorage.getItem("bt-upd")}catch(e){}if(dn===m[1])return;const go=()=>{if($("#layer").innerHTML||momentOpen){setTimeout(go,4000);return}try{sessionStorage.setItem("bt-upd",m[1])}catch(e){}location.reload()};go()}).catch(()=>{})}
setTimeout(checkUpdate,1500);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkUpdate()});
})();

</script>
